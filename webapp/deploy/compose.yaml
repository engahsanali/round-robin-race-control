# Round Robin Race Manager on the Hostinger VPS (srv1977073).
# Lives at /opt/round-robin-race-manager/compose.yaml. Not public by itself:
# ahsantechlabs-site-web-1 (nginx) proxies /roundrobin/ to round-robin-app:8787
# over the coolify network. The 127.0.0.1 port is for checks through an SSH tunnel only.
name: round-robin-race-manager
services:
  app:
    image: rr-race-manager:${RR_IMAGE_TAG:?set RR_IMAGE_TAG}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    # RR_GOOGLE_CLIENT_ID and RR_GOOGLE_CLIENT_SECRET (root-only file on the VPS).
    env_file:
      - ./secrets/google.env
      # RESEND_API_KEY (root-only file on the VPS).
      - ./secrets/mail.env
    environment:
      # Must match the redirect URI registered on the Google OAuth client.
      RR_GOOGLE_REDIRECT_URI: https://ahsantechlabs.com/roundrobin/api/auth/google/callback
      RR_BASE_PATH: /roundrobin
      # Links in emails always use this, never the request Host header.
      RR_APP_URL: https://ahsantechlabs.com/roundrobin
      RR_MAIL_FROM: Round Robin <contact@ahsantechlabs.com>
      RR_MAIL_REPLY_TO: contact@ahsantechlabs.com
      RR_DATA_DIR: /data
      # Admin sign-in: Google only, for these verified accounts.
      RR_ADMIN_GOOGLE_EMAILS: engrahsanali91@gmail.com,ahsantechlabs@gmail.com
      # Break-glass email + password + TOTP sign-in (scripts/make-admin.mjs). Off unless set to "1".
      RR_ADMIN_PASSWORD_LOGIN: "0"
      RR_ADMIN_FILE: /secrets/admin.json
      # Private admin links created before the move can still be claimed.
      RR_LEGACY_LINK_HOSTS: round-robin-race-manager.netlify.app
    volumes:
      - ./data:/data
      - ./secrets/admin.json:/secrets/admin.json:ro
    ports:
      - "127.0.0.1:18787:8787"
    networks:
      coolify:
        aliases: [round-robin-app]
    labels:
      traefik.enable: "false"
networks:
  coolify:
    external: true
