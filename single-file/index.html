<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Round Robin Race Control — Solo</title>
  <style>
    :root {
      color-scheme: dark;
      --graphite-950: #090d10;
      --graphite-900: #10161b;
      --graphite-850: #151d23;
      --graphite-800: #1c262e;
      --graphite-700: #2a3944;
      --surface: var(--graphite-950);
      --surface-raised: var(--graphite-900);
      --surface-panel: var(--graphite-850);
      --line: #344550;
      --text: #f6f9fb;
      --text-muted: #aebbc3;
      --cyan: #26d9ff;
      --cyan-soft: #0b4655;
      --on-accent: #061116;
      --lime: #b5f23d;
      --warning: #ffbd45;
      --error: #ff6b7a;
      --success: #69e59c;
      --focus: #7ce8ff;
      --gold: #f4c95d;
      --silver: #c8d1d8;
      --bronze: #d68b59;
      --space-1: .25rem;
      --space-2: .5rem;
      --space-3: .75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
      --radius-sm: .5rem;
      --radius-md: .875rem;
      --radius-lg: 1.25rem;
      --shadow-sm: 0 4px 18px rgba(0, 0, 0, .18);
      --shadow-lg: 0 18px 60px rgba(0, 0, 0, .32);
      --max-width: 80rem;
      --transition: 180ms ease;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--surface);
      color: var(--text);
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --surface: #edf2f4;
      --surface-raised: #ffffff;
      --surface-panel: #f7fafb;
      --line: #bdcbd2;
      --text: #101a20;
      --text-muted: #50636e;
      --cyan: #007d9a;
      --cyan-soft: #d8f3f9;
      --on-accent: #ffffff;
      --lime: #4f7900;
      --warning: #8d5700;
      --error: #ba2538;
      --success: #147946;
      --focus: #006d88;
      --shadow-sm: 0 4px 18px rgba(25, 47, 58, .10);
      --shadow-lg: 0 18px 60px rgba(25, 47, 58, .16);
    }

    * { box-sizing: border-box; }

    html { min-width: 320px; background: var(--surface); }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 12% -10%, color-mix(in srgb, var(--cyan) 14%, transparent), transparent 28rem),
        var(--surface);
      color: var(--text);
      line-height: 1.5;
    }

    button, select, input { font: inherit; }

    button, select {
      min-block-size: 48px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface-panel);
      color: var(--text);
      transition: border-color var(--transition), background-color var(--transition), color var(--transition), transform var(--transition);
    }

    button { cursor: pointer; }
    button:hover { border-color: var(--cyan); }
    button:active { transform: translateY(1px); }

    a:focus, button:focus, select:focus, input:focus, dialog:focus {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .skip-link {
      position: fixed;
      inset: var(--space-3) auto auto var(--space-3);
      z-index: 100;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-sm);
      background: var(--cyan);
      color: var(--on-accent);
      font-weight: 800;
      transform: translateY(-200%);
    }

    .skip-link:focus { transform: translateY(0); }

    .shell-header {
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface-raised) 92%, transparent);
    }

    .masthead, .status-strip, .main-inner, .footer-inner {
      width: min(100% - 2rem, var(--max-width));
      margin-inline: auto;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding-block: var(--space-5) var(--space-4);
    }

    .brand-lockup { display: flex; align-items: center; gap: var(--space-4); min-width: 0; }

    .mark {
      display: grid;
      min-width: 4.75rem;
      min-height: 4.75rem;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--cyan) 65%, var(--line));
      border-radius: 50%;
      background: linear-gradient(145deg, var(--surface-panel), var(--surface-raised));
      box-shadow: inset 0 0 0 5px var(--surface-raised), 0 0 30px color-mix(in srgb, var(--cyan) 17%, transparent);
      color: var(--cyan);
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: .06em;
    }

    .eyebrow {
      margin: 0 0 var(--space-1);
      color: var(--lime);
      font-size: .72rem;
      font-weight: 850;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(1.15rem, 3vw, 1.75rem); line-height: 1.1; letter-spacing: -.025em; }

    .edition {
      display: inline-flex;
      align-items: center;
      min-block-size: 2rem;
      padding-inline: var(--space-3);
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text-muted);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .theme-control { display: grid; gap: var(--space-1); color: var(--text-muted); font-size: .78rem; font-weight: 700; }
    .theme-control select { min-width: 7.5rem; padding-inline: var(--space-3) 2rem; }

    .status-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding-block: var(--space-3);
    }

    .event-state { display: flex; align-items: center; gap: var(--space-2); font-size: .9rem; font-weight: 760; }
    .event-state::before { content: ""; width: .65rem; height: .65rem; border-radius: 50%; background: var(--warning); box-shadow: 0 0 0 4px color-mix(in srgb, var(--warning) 16%, transparent); }
    .storage-note { color: var(--text-muted); font-size: .78rem; text-align: right; }

    .view-nav {
      width: 100%;
      overflow-x: auto;
      border-block: 1px solid var(--line);
      scrollbar-color: var(--cyan) var(--surface-raised);
      background: var(--surface-raised);
    }

    .nav-track {
      display: flex;
      width: min(var(--max-width), max-content);
      min-width: max-content;
      margin-inline: auto;
      padding: var(--space-2) var(--space-4);
      gap: var(--space-2);
    }

    .nav-button {
      min-width: 7.25rem;
      padding-inline: var(--space-3);
      border-color: transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: .84rem;
      font-weight: 750;
      white-space: nowrap;
    }

    .nav-button[aria-current="page"] { border-color: var(--cyan); background: var(--cyan-soft); color: var(--text); }

    main { min-height: 31rem; }
    .main-inner { padding-block: clamp(2rem, 6vw, 4.75rem); }

    .view-heading { max-width: 48rem; margin-bottom: var(--space-6); }
    .view-heading h2 { margin: 0; font-size: clamp(1.8rem, 5vw, 3.4rem); line-height: 1.02; letter-spacing: -.055em; }
    .view-kicker { margin: 0 0 var(--space-3); color: var(--cyan); font-size: .78rem; font-weight: 850; letter-spacing: .15em; text-transform: uppercase; }
    .view-summary { max-width: 42rem; margin: var(--space-4) 0 0; color: var(--text-muted); font-size: 1.05rem; }

    .empty-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(16rem, .65fr); gap: var(--space-5); }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: linear-gradient(145deg, var(--surface-panel), var(--surface-raised));
      box-shadow: var(--shadow-sm);
    }

    .empty-card { padding: clamp(1.5rem, 5vw, 3rem); }
    .empty-card h3 { margin: 0; font-size: clamp(1.45rem, 4vw, 2.25rem); letter-spacing: -.035em; }
    .empty-card p { max-width: 41rem; color: var(--text-muted); }

    .action-row { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-5); }
    .primary-action { padding-inline: var(--space-5); border-color: var(--cyan); background: var(--cyan); color: var(--on-accent); font-weight: 850; transition-property: transform; }
    .secondary-action { padding-inline: var(--space-5); border-color: var(--line); background: transparent; color: var(--text); font-weight: 780; }

    .trust-panel { padding: var(--space-5); }
    .trust-panel h3 { margin: 0 0 var(--space-4); font-size: 1rem; }
    .trust-list { display: grid; gap: var(--space-4); margin: 0; padding: 0; list-style: none; }
    .trust-list li { display: grid; grid-template-columns: 1.75rem 1fr; gap: var(--space-3); color: var(--text-muted); font-size: .9rem; }
    .trust-list strong { display: block; color: var(--text); }
    .signal { display: grid; width: 1.75rem; height: 1.75rem; place-items: center; border-radius: 50%; background: var(--cyan-soft); color: var(--cyan); font-weight: 900; }

    .view-placeholder { max-width: 46rem; padding: var(--space-5); }
    .view-placeholder p { color: var(--text-muted); }

    .workspace { display: grid; gap: var(--space-5); }
    .panel-section { padding: clamp(1rem, 3vw, 1.75rem); }
    .panel-section h2, .panel-section h3 { margin-top: 0; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: var(--space-4); }
    .field { display: grid; align-content: start; gap: var(--space-1); color: var(--text-muted); font-size: .82rem; font-weight: 750; }
    .field input, .field select, .field textarea { width: 100%; min-block-size: 48px; padding: .7rem .8rem; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-raised); color: var(--text); font: inherit; }
    .field textarea { min-block-size: 6rem; resize: vertical; }
    .field-error { min-height: 1.2rem; margin: 0; color: var(--error); font-size: .78rem; font-weight: 720; }
    .wizard-steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--space-2); margin: 0; padding: 0; list-style: none; }
    .wizard-steps li { padding: var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-sm); color: var(--text-muted); font-size: .76rem; font-weight: 780; }
    .wizard-steps li[aria-current="step"] { border-color: var(--cyan); background: var(--cyan-soft); color: var(--text); }
    .data-table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .75rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { color: var(--text-muted); font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; }
    td { font-size: .88rem; }
    .badge { display: inline-flex; min-height: 1.7rem; align-items: center; padding-inline: .6rem; border: 1px solid var(--line); border-radius: 999px; color: var(--text-muted); font-size: .73rem; font-weight: 800; }
    .badge.good { border-color: var(--success); color: var(--success); }
    .badge.warn { border-color: var(--warning); color: var(--warning); }
    .badge.credit { border-color: var(--cyan); color: var(--cyan); }
    .notice { padding: var(--space-4); border: 1px solid var(--warning); border-radius: var(--radius-md); background: color-mix(in srgb, var(--warning) 9%, var(--surface-raised)); color: var(--text); }
    .notice.error { border-color: var(--error); background: color-mix(in srgb, var(--error) 9%, var(--surface-raised)); }
    .split-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-3); }
    .compact-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .compact-actions button { min-block-size: 40px; padding-inline: .8rem; font-size: .78rem; }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: var(--space-3); }
    .summary-card { padding: var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-raised); }
    .summary-card strong { display: block; font-size: 1.25rem; }
    .summary-card span { color: var(--text-muted); font-size: .78rem; }
    .save-confidence { color: var(--text-muted); font-size: .8rem; }

    .live-dock { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-top: var(--space-5); padding: var(--space-3) var(--space-4); }
    .live-dock strong { font-size: .9rem; }
    .live-dock span { color: var(--text-muted); font-size: .82rem; }
    .schedule-list, .lane-grid { display: grid; gap: var(--space-3); }
    .schedule-list { grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
    .schedule-heat { padding: var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-raised); }
    .schedule-heat strong { display: block; }
    .quality-label { margin: 0; color: var(--cyan); font-weight: 800; }
    .lane-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .lane-card { display: grid; min-height: 9rem; align-content: center; justify-items: start; gap: var(--space-2); padding: var(--space-4); text-align: left; }
    .lane-card[aria-pressed="true"] { border-color: var(--lime); background: color-mix(in srgb, var(--lime) 12%, var(--surface-raised)); }
    .lane-card:disabled { cursor: not-allowed; opacity: .58; }
    .lane-number { color: var(--cyan); font-size: .75rem; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }
    .lane-car { font-size: clamp(1rem, 3vw, 1.35rem); font-weight: 850; }
    .confirmation-dock { position: sticky; z-index: 10; bottom: 0; padding: var(--space-4); border-color: var(--cyan); box-shadow: 0 -10px 30px rgba(0, 0, 0, .3); }
    .receipt { border-color: var(--success); }
    .shortcut-list { color: var(--text-muted); font-size: .82rem; }
    .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); gap: var(--space-4); }
    .chart-card { min-width: 0; padding: var(--space-4); overflow: hidden; }
    .chart-card h3 { margin: 0; font-size: 1rem; }
    .chart-graphic { display: block; width: 100%; height: auto; min-height: 11rem; margin-block: var(--space-3); border-radius: var(--radius-sm); background: color-mix(in srgb, var(--cyan) 4%, var(--surface-raised)); }
    .chart-takeaway { margin-bottom: var(--space-2); color: var(--text-muted); }
    .chart-status { display: inline-flex; gap: var(--space-2); align-items: center; color: var(--text); font-size: .8rem; font-weight: 800; }
    .chart-status::before { content: "◆"; color: var(--cyan); }
    .chart-card details { margin-top: var(--space-3); }
    .chart-card summary { min-block-size: 44px; padding-block: .65rem; cursor: pointer; color: var(--cyan); font-weight: 750; }
    .standings-table [data-rank-delta] { display: block; color: var(--cyan); font-size: .72rem; font-weight: 800; animation: rank-confirm 220ms ease both; }
    @keyframes rank-confirm { from { opacity: .35; transform: translateY(.25rem); } to { opacity: 1; transform: translateY(0); } }
    .rank-proof { margin-top: var(--space-3); padding: var(--space-4); border: 1px solid var(--cyan); border-radius: var(--radius-md); background: var(--surface-raised); }
    .rank-proof ul { margin-bottom: 0; }
    .podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: var(--space-2); min-height: 12rem; padding: var(--space-3); }
    .podium-place { display: grid; place-items: center; min-height: 6rem; padding: var(--space-2); border: 1px solid var(--line); border-radius: var(--radius-sm); text-align: center; }
    .podium-place:first-child { min-height: 10rem; border-color: var(--gold); }
    .podium-place:nth-child(2) { min-height: 8rem; border-color: var(--silver); }
    .podium-place:nth-child(3) { border-color: var(--bronze); }
    .qualification-band { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: var(--space-2); }
    .qualification-band > div { padding: var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-sm); }
    .share-canvas { display: block; width: min(100%, 48rem); height: auto; border: 1px solid var(--line); border-radius: var(--radius-md); background: #10161b; }
    .seal { display: inline-flex; align-items: center; gap: var(--space-2); padding: .55rem .8rem; border: 2px double var(--gold); border-radius: 999px; color: var(--gold); font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
    .print-sheet { margin-top: var(--space-4); }

    .shell-footer { border-top: 1px solid var(--line); background: var(--surface-raised); }
    .footer-inner { display: flex; justify-content: space-between; gap: var(--space-4); padding-block: var(--space-5); color: var(--text-muted); font-size: .8rem; }
    .credit { color: var(--text); font-weight: 720; }

    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    dialog { max-width: min(34rem, calc(100% - 2rem)); padding: 0; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface-raised); color: var(--text); box-shadow: var(--shadow-lg); }
    dialog::backdrop { background: rgba(2, 7, 10, .76); }
    .dialog-inner { padding: var(--space-5); }

    @media (max-width: 700px) {
      .masthead { align-items: flex-start; }
      .mark { min-width: 3.6rem; min-height: 3.6rem; }
      .edition, .storage-note { display: none; }
      .empty-grid { grid-template-columns: 1fr; }
      .footer-inner { flex-direction: column; }
      .wizard-steps { grid-template-columns: 1fr; }
      .lane-grid { grid-template-columns: 1fr; }
      .podium { grid-template-columns: 1fr; align-items: stretch; }
      .podium-place, .podium-place:first-child, .podium-place:nth-child(2) { min-height: 5rem; }
    }

    @media (max-width: 420px) {
      .masthead, .status-strip, .main-inner, .footer-inner { width: min(100% - 1.25rem, var(--max-width)); }
      .masthead { gap: var(--space-2); }
      .brand-lockup { gap: var(--space-2); }
      .mark { min-width: 3.1rem; min-height: 3.1rem; font-size: .78rem; }
      h1 { font-size: 1rem; }
      .theme-control select { min-width: 6.5rem; }
      .nav-track { margin-inline: 0; padding-inline: .625rem; }
      .nav-button { min-width: 7.5rem; }
      .action-row > * { width: 100%; }
      .live-dock { position: sticky; z-index: 10; bottom: 0; border-color: var(--cyan); box-shadow: 0 -10px 30px rgba(0, 0, 0, .3); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }

    @media print {
      :root { color-scheme: light; --surface: #fff; --surface-raised: #fff; --surface-panel: #fff; --text: #000; --text-muted: #333; --line: #777; }
      body { background: #fff; }
      .skip-link, .theme-control, .view-nav, .action-row, .live-dock, dialog, [data-print-controls], [data-share-controls] { display: none !important; }
      .shell-header, .shell-footer, .panel { box-shadow: none; }
      .main-inner { padding-block: 1rem; }
      .credit { color: #000; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header class="shell-header">
    <div class="masthead">
      <div class="brand-lockup">
        <div class="mark" aria-label="Round Robin three">RR · 3</div>
        <div>
          <p class="eyebrow">Race operations</p>
          <h1>Round Robin Race Control</h1>
        </div>
        <span class="edition">Solo</span>
      </div>
      <label class="theme-control" for="theme-select">
        Theme
        <select id="theme-select" data-action="set-theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>
    </div>
    <div class="status-strip" aria-label="Event status">
      <span class="event-state">No event loaded</span>
      <span class="storage-note">Local-first · offline-ready shell</span>
    </div>
  </header>

  <nav class="view-nav" aria-label="Primary views">
    <div class="nav-track">
      <button class="nav-button" type="button" data-view="dashboard" aria-current="page">Dashboard</button>
      <button class="nav-button" type="button" data-view="registration">Registration</button>
      <button class="nav-button" type="button" data-view="setup">Race Setup</button>
      <button class="nav-button" type="button" data-view="live">Live Racing</button>
      <button class="nav-button" type="button" data-view="standings">Standings</button>
      <button class="nav-button" type="button" data-view="finals">Finals</button>
      <button class="nav-button" type="button" data-view="reports">Reports</button>
      <button class="nav-button" type="button" data-view="settings">Settings</button>
      <button class="nav-button" type="button" data-view="diagnostics">Diagnostics</button>
    </div>
  </nav>

  <main id="main-content" data-active-view="dashboard" tabindex="-1">
    <div class="main-inner" id="view-content"></div>
  </main>

  <footer class="shell-footer">
    <div class="footer-inner">
      <span class="credit">Made by Cesar Lacsamana and Ahsan Ali</span>
      <span>Round Robin Race Control · Solo Edition</span>
    </div>
  </footer>

  <div id="save-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="error-status" class="visually-hidden" role="alert" aria-live="assertive" aria-atomic="true"></div>
  <input id="import-input" aria-label="Import event JSON" type="file" accept="application/json,.json" hidden>
